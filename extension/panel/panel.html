<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerFill</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <img src="../icons/icon48.png" alt="" width="22" height="22">
    <strong>PowerFill</strong>
    <span class="spacer"></span>
    <button id="detailsBtn" class="icon" title="My details: your own name, email and so on, for use in any profile" aria-label="My details"></button>
  </header>
  <main id="view"></main>
  <div id="toast" role="status" hidden></div>
  <dialog id="ask"></dialog>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <input id="dataFile" type="file" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden>
  <script type="module" src="panel.js"></script>
</body>
</html>
